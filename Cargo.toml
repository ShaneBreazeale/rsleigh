[package]
name = "rsleigh"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "SLEIGH (.slaspec) parser and Rust decoder/P-code emitter codegen — Ghidra-compatible disassembly in pure Rust"
readme = "README.md"
keywords = ["sleigh", "pcode", "decoder", "disassembler", "ghidra"]
categories = ["development-tools", "parser-implementations"]

[workspace.package]
version = "0.3.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/ShaneBreazeale/rsleigh"
authors = ["Shane Breazeale"]

[workspace]
members = [
    "pcode-ir",
    "test-harness",
    "rsleigh-generate",
    "generated/x86",
    "generated/x86-32",
    "generated/aarch64",
    "generated/arm32",
    "generated/mips",
    "generated/riscv",
    "rsleigh-api",
    "rsleigh-fid",
    "rsleigh-decompile",
    "rsleigh-cli",
]
resolver = "2"

[[bin]]
name = "rsleigh"
path = "src/bin/rsleigh.rs"

[dependencies]
nom = "7"
thiserror = "1"
tracing = "0.1.40"
quote = "1"
bitvec = "1"
proc-macro2 = "1"
indexmap = "1.9"
ethnum = "1"
rsleigh-cli = { path = "rsleigh-cli", version = "0.3" }

[features]
thread = []
no_overflow_inline = []
strict_solve = []
