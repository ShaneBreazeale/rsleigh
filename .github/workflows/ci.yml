name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Generated decoder crates are large enough that parallel rustc processes
      # can exceed the hosted runner's memory limit (exit 143).
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Test — stable raw lift generation
        run: cargo test --release -p rsleigh --no-default-features --test codegen_lift_order

      # Generate code from slaspecs (~30s)
      - name: Generate Rust from slaspecs
        run: cargo run -p rsleigh-generate

      # Use the test profile to avoid compiling the large decoders twice.
      - name: Build all crates
        run: cargo build --workspace --release

      # Run golden P-code + decompiler validation tests.
      # --release sidesteps a pre-existing stack overflow in the
      # ghidra_oracle_parity test under debug builds on Linux (recursive
      # SLEIGH lift hits the 8 MiB default thread stack only when unoptimised).
      - name: Test — golden P-code + decompiler validation
        run: cargo test --release -p test-harness

      # Run decompiler unit tests (signature DB, type system)
      - name: Test — decompiler unit tests
        run: cargo test --release -p rsleigh-decompile --lib

      - name: Test — provenance and bounded dependency traversal
        run: cargo test --release -p rsleigh-decompile --test instruction_provenance --test memory_dependencies --test interprocedural_dependencies --test return_value_validation --test native_return_registers

      - name: Test — PE64 SEH-SMC fixtures
        run: cargo test --release -p rsleigh-decompile --test seh_smc_fixture

      # Build and execute agent workflow and publication/error-path regressions.
      - name: Test — CLI and agent contracts (release)
        run: cargo test --release -p rsleigh-cli --lib --tests

      - name: Test — deterministic agent RE tasks
        run: cargo run --release -p rsleigh-cli --example agent_re_eval -- target/release/rsleigh agent-re-results.json

      - name: Test — full six-architecture RE corpus and cache states
        run: cargo run --release -p rsleigh-cli --example agent_re_eval -- target/release/rsleigh agent-re-full-results.json --full-corpus

      - name: Test — cached card equivalence and recomputation counters
        run: cargo run --release -p rsleigh-cli --example agent_re_eval -- target/release/rsleigh agent-re-cache-results.json --cache-benchmark

  seh-smc-windows:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Execute PE64 SEH-SMC fixtures
        shell: pwsh
        run: ./test-harness/fixtures/seh-smc/verify-windows.ps1

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Generate Rust from slaspecs
        run: cargo run -p rsleigh-generate

      # Lint core crates (pcode-ir, rsleigh-api, rsleigh-decompile)
      # Skip generated crates (they have intentional patterns clippy dislikes)
      - name: Clippy — core crates
        run: cargo clippy -p pcode-ir -p rsleigh-api -p rsleigh-decompile -p rsleigh-cli -- -D warnings
        continue-on-error: true  # Don't block on clippy warnings during development

  # Fast compile check — only pcode-ir (no generated code dependency)
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check pcode-ir (no codegen needed)
        run: cargo check -p pcode-ir
