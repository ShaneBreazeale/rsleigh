name: Refresh Context7 Docs

on:
  push:
    branches:
      - master
    paths:
      - README.md
      - llms.txt
      - CHANGELOG.md
      - docs/**
      - context7.json
      - .github/workflows/context7.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check Context7 API key
        id: api-key
        env:
          CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
        shell: bash
        run: |
          if [[ -z "$CONTEXT7_API_KEY" ]]; then
            echo "::notice::CONTEXT7_API_KEY is not configured; skipping refresh."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Context7 refresh
        if: steps.api-key.outputs.configured == 'true'
        env:
          CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
        run: |
          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT
          http_status=$(curl --silent --show-error \
            --output "$response_file" --write-out '%{http_code}' \
            --request POST https://context7.com/api/v1/refresh \
            --header "Content-Type: application/json" \
            --header "Authorization: Bearer $CONTEXT7_API_KEY" \
            --data "{\"libraryName\":\"/${{ github.repository }}\"}")
          if [[ "$http_status" == 2* ]]; then
            cat "$response_file"
          elif [[ "$http_status" == 400 ]] && jq -e '.error == "too-early"' "$response_file" >/dev/null; then
            echo "::notice::Context7 refresh skipped: the library is still within its refresh interval."
            echo "Context7 refresh deferred by the service's minimum refresh interval." >> "$GITHUB_STEP_SUMMARY"
          else
            cat "$response_file"
            echo "::error::Context7 refresh failed (HTTP $http_status)."
            exit 1
          fi
