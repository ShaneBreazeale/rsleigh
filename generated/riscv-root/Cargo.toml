[package]
name = "rsleigh-gen-riscv-root"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "rsleigh generated decoder for riscv — instruction decoder root (internal, do not depend on directly; use rsleigh-api)"
include = ["src/**", "out/**", "Cargo.toml"]
[dependencies]
pcode-ir = { path = "../../pcode-ir", version = "0.2.0" }
riscv-shared = { package = "rsleigh-gen-riscv-shared", path = "../riscv-shared", version = "0.2.0" }
riscv-subtables = { package = "rsleigh-gen-riscv-subtables", path = "../riscv-subtables", version = "0.2.0" }
riscv-instr-00 = { package = "rsleigh-gen-riscv-instr-00", path = "../riscv-instr-00", version = "0.2.0" }
riscv-instr-01 = { package = "rsleigh-gen-riscv-instr-01", path = "../riscv-instr-01", version = "0.2.0" }
