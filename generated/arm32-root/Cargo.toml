[package]
name = "rsleigh-gen-arm32-root"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "rsleigh generated decoder for arm32 — instruction decoder root (internal, do not depend on directly; use rsleigh-api)"
include = ["src/**", "out/**", "Cargo.toml"]
[dependencies]
pcode-ir = { path = "../../pcode-ir", version = "0.2.0" }
arm32-shared = { package = "rsleigh-gen-arm32-shared", path = "../arm32-shared", version = "0.2.0" }
arm32-subtables = { package = "rsleigh-gen-arm32-subtables", path = "../arm32-subtables", version = "0.2.0" }
arm32-instr-00 = { package = "rsleigh-gen-arm32-instr-00", path = "../arm32-instr-00", version = "0.2.0" }
arm32-instr-01 = { package = "rsleigh-gen-arm32-instr-01", path = "../arm32-instr-01", version = "0.2.0" }
