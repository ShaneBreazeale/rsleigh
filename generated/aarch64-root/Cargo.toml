[package]
name = "rsleigh-gen-aarch64-root"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "rsleigh generated decoder for aarch64 — instruction decoder root (internal, do not depend on directly; use rsleigh-api)"
include = ["src/**", "out/**", "Cargo.toml"]

[dependencies]
pcode-ir = { path = "../../pcode-ir", version = "0.2.0" }
aarch64-shared = { package = "rsleigh-gen-aarch64-shared", path = "../aarch64-shared", version = "0.2.0" }
aarch64-subtables = { package = "rsleigh-gen-aarch64-subtables", path = "../aarch64-subtables", version = "0.2.0" }
aarch64-instr-00 = { package = "rsleigh-gen-aarch64-instr-00", path = "../aarch64-instr-00", version = "0.2.0" }
aarch64-instr-01 = { package = "rsleigh-gen-aarch64-instr-01", path = "../aarch64-instr-01", version = "0.2.0" }
aarch64-instr-02 = { package = "rsleigh-gen-aarch64-instr-02", path = "../aarch64-instr-02", version = "0.2.0" }
aarch64-instr-03 = { package = "rsleigh-gen-aarch64-instr-03", path = "../aarch64-instr-03", version = "0.2.0" }
