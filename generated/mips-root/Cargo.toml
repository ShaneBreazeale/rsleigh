[package]
name = "rsleigh-gen-mips-root"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "rsleigh generated decoder for mips — instruction decoder root (internal, do not depend on directly; use rsleigh-api)"
include = ["src/**", "out/**", "Cargo.toml"]
[dependencies]
pcode-ir = { path = "../../pcode-ir", version = "0.2.0" }
mips-shared = { package = "rsleigh-gen-mips-shared", path = "../mips-shared", version = "0.2.0" }
mips-subtables = { package = "rsleigh-gen-mips-subtables", path = "../mips-subtables", version = "0.2.0" }
mips-instr-00 = { package = "rsleigh-gen-mips-instr-00", path = "../mips-instr-00", version = "0.2.0" }
mips-instr-01 = { package = "rsleigh-gen-mips-instr-01", path = "../mips-instr-01", version = "0.2.0" }
