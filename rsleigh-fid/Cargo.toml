[package]
name = "rsleigh-fid"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Function ID database — Ghidra FID-compatible function fingerprinting in pure Rust"
keywords = ["fid", "fingerprint", "reverse-engineering", "ghidra"]
categories = ["development-tools"]

[[bin]]
name = "rsleigh-fid-gen"
path = "src/bin/gen.rs"

[dependencies]
rsleigh-api = { path = "../rsleigh-api", version = "0.4.2" }
pcode-ir = { path = "../pcode-ir", version = "0.4.2" }
goblin = "0.9"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
flate2 = "1"
byteorder = "1"
