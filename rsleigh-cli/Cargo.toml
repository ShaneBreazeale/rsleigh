[package]
name = "rsleigh-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "CLI decompiler — turn any binary into C-like pseudocode"
keywords = ["decompiler", "reverse-engineering", "disassembler", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "rsleigh"
path = "src/main.rs"

[dependencies]
pcode-ir = { path = "../pcode-ir", version = "0.4.1" }
rsleigh-api = { path = "../rsleigh-api", version = "0.4.1" }
rsleigh-decompile = { path = "../rsleigh-decompile", version = "0.4.1" }
rsleigh-fid = { path = "../rsleigh-fid", version = "0.4.1" }
goblin = "0.9"
serde_json = "1"
wasmparser = "0.225"
md-5 = "0.10"
sha2 = "0.10"
cpp_demangle = "0.4"
