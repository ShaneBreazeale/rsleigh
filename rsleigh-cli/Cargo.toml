[package]
name = "rsleigh-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "CLI decompiler — turn any binary into C-like pseudocode"
keywords = ["decompiler", "reverse-engineering", "disassembler", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "rsleigh"
path = "src/main.rs"

[features]
# Pass-through to rsleigh-decompile's `smt` feature. Off by default.
# Pulls libz3 — see docs/smt-backend.md for build env.
smt = ["rsleigh-decompile/smt"]

[dependencies]
pcode-ir = { path = "../pcode-ir", version = "0.4.3" }
rsleigh-api = { path = "../rsleigh-api", version = "0.4.3" }
rsleigh-decompile = { path = "../rsleigh-decompile", version = "0.4.3" }
rsleigh-fid = { path = "../rsleigh-fid", version = "0.4.3" }
goblin = "0.9"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
wasmparser = "0.225"
md-5 = "0.10"
sha2 = "0.10"
cpp_demangle = "0.4"
