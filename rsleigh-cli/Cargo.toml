[package]
name = "rsleigh-cli"
version = "0.1.0"
edition = "2021"
description = "CLI decompiler — turn any binary into C-like pseudocode"

[[bin]]
name = "rsleigh"
path = "src/main.rs"

[dependencies]
pcode-ir = { path = "../pcode-ir" }
rsleigh-api = { path = "../rsleigh-api" }
rsleigh-decompile = { path = "../rsleigh-decompile" }
goblin = "0.9"
serde_json = "1"
wasmparser = "0.225"
md-5 = "0.10"
sha2 = "0.10"
