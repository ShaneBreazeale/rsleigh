[package]
name = "rsleigh-decompile"
version = "0.1.0"
edition = "2021"
description = "P-code decompiler — turns rsleigh P-code IR into C-like pseudocode"

[dependencies]
pcode-ir = { path = "../pcode-ir" }
rsleigh-api = { path = "../rsleigh-api" }
goblin = "0.9"
gimli = "0.31"
object = "0.36"
cpp_demangle = "0.5"
pdb = "0.8"
fallible-iterator = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
egg = "0.11"
msvc-demangler = "0.11"
iced-x86 = { version = "1", default-features = false, features = ["decoder", "std", "no_vex", "no_evex", "no_xop", "no_d3now", "instr_info"] }
