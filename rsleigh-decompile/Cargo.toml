[package]
name = "rsleigh-decompile"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "P-code decompiler — turns rsleigh P-code IR into C-like pseudocode"
keywords = ["decompiler", "pcode", "reverse-engineering", "sleigh", "ghidra"]
categories = ["development-tools"]

[dependencies]
pcode-ir = { path = "../pcode-ir", version = "0.2.0" }
rsleigh-api = { path = "../rsleigh-api", version = "0.2.0" }
goblin = "0.9"
gimli = "0.31"
object = "0.36"
cpp_demangle = "0.5"
pdb = "0.8"
fallible-iterator = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
egg = "0.11"
msvc-demangler = "0.11"
iced-x86 = { version = "1", default-features = false, features = ["decoder", "std", "no_vex", "no_evex", "no_xop", "no_d3now", "instr_info"] }
