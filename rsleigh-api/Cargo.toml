[package]
name = "rsleigh-api"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "High-level API for rsleigh — decode instructions and emit P-code for x86, x86-32, AArch64, ARM32, MIPS32, RISC-V 64"
keywords = ["disassembler", "pcode", "decoder", "sleigh", "ghidra"]
categories = ["development-tools", "parsing"]

[dependencies]
pcode-ir = { path = "../pcode-ir", version = "0.2.0" }
x86-root = { package = "rsleigh-gen-x86-root", path = "../generated/x86-root", version = "0.2.0" }
x86-32-root = { package = "rsleigh-gen-x86-32-root", path = "../generated/x86-32-root", version = "0.2.0" }
aarch64-root = { package = "rsleigh-gen-aarch64-root", path = "../generated/aarch64-root", version = "0.2.0" }
riscv-root = { package = "rsleigh-gen-riscv-root", path = "../generated/riscv-root", version = "0.2.0" }
mips-root = { package = "rsleigh-gen-mips-root", path = "../generated/mips-root", version = "0.2.0" }
arm32-root = { package = "rsleigh-gen-arm32-root", path = "../generated/arm32-root", version = "0.2.0" }
