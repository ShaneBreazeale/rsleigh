[package]
name = "pcode-ir"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "P-code intermediate representation types for SLEIGH-generated decoders"
keywords = ["pcode", "ir", "sleigh", "ghidra", "no-std"]
categories = ["no-std", "data-structures"]

# Generated decoders retain zero runtime dependencies by default.
[features]
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", default-features = false, features = ["alloc", "derive"], optional = true }
