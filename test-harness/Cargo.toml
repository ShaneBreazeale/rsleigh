[package]
name = "test-harness"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
pcode-ir = { path = "../pcode-ir" }
x86-root = { package = "rsleigh-gen-x86", path = "../generated/x86" }
aarch64-root = { package = "rsleigh-gen-aarch64", path = "../generated/aarch64" }
riscv-root = { package = "rsleigh-gen-riscv", path = "../generated/riscv" }
mips-root = { package = "rsleigh-gen-mips", path = "../generated/mips" }
arm32-root = { package = "rsleigh-gen-arm32", path = "../generated/arm32" }
rsleigh-api = { path = "../rsleigh-api" }
rsleigh-decompile = { path = "../rsleigh-decompile" }
goblin = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
