[package]
name = "test-harness"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
pcode-ir = { path = "../pcode-ir" }
x86-root = { package = "rsleigh-gen-x86-root", path = "../generated/x86-root" }
aarch64-root = { package = "rsleigh-gen-aarch64-root", path = "../generated/aarch64-root" }
riscv-root = { package = "rsleigh-gen-riscv-root", path = "../generated/riscv-root" }
mips-root = { package = "rsleigh-gen-mips-root", path = "../generated/mips-root" }
arm32-root = { package = "rsleigh-gen-arm32-root", path = "../generated/arm32-root" }
rsleigh-api = { path = "../rsleigh-api" }
rsleigh-decompile = { path = "../rsleigh-decompile" }
goblin = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
